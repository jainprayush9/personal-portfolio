<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAF8"/>
      <stop offset="100%" style="stop-color:#F5EDE8"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9440A"/>
      <stop offset="100%" style="stop-color:#E8621A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000012"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg1)"/>

  <!-- Subtle grid -->
  <g stroke="#E8DDD8" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Label top left -->
  <text x="40" y="48" font-size="10" font-weight="600" letter-spacing="2" fill="#C9440A" text-transform="uppercase">GROWTH · B2C · 0→1</text>

  <!-- Main title -->
  <text x="40" y="80" font-size="22" font-weight="700" fill="#1A1410" letter-spacing="-0.5">Onboarding Redesign</text>

  <!-- BEFORE section -->
  <text x="40" y="130" font-size="10" font-weight="700" letter-spacing="1.5" fill="#A08070">BEFORE</text>

  <!-- 9 steps (complex, muted) -->
  <g opacity="0.45">
    <!-- Row 1: circles 1-5 -->
    <circle cx="55"  cy="160" r="14" fill="#D4C4BC" stroke="#C4B4AB" stroke-width="1"/>
    <text x="55"  y="165" text-anchor="middle" font-size="9" font-weight="600" fill="#6B5040">1</text>
    <line x1="69" y1="160" x2="81" y2="160" stroke="#C4B4AB" stroke-width="1.5"/>

    <circle cx="95"  cy="160" r="14" fill="#D4C4BC" stroke="#C4B4AB" stroke-width="1"/>
    <text x="95"  y="165" text-anchor="middle" font-size="9" font-weight="600" fill="#6B5040">2</text>
    <line x1="109" y1="160" x2="121" y2="160" stroke="#C4B4AB" stroke-width="1.5"/>

    <circle cx="135" cy="160" r="14" fill="#D4C4BC" stroke="#C4B4AB" stroke-width="1"/>
    <text x="135" y="165" text-anchor="middle" font-size="9" font-weight="600" fill="#6B5040">3</text>
    <line x1="149" y1="160" x2="161" y2="160" stroke="#C4B4AB" stroke-width="1.5"/>

    <circle cx="175" cy="160" r="14" fill="#D4C4BC" stroke="#C4B4AB" stroke-width="1"/>
    <text x="175" y="165" text-anchor="middle" font-size="9" font-weight="600" fill="#6B5040">4</text>
    <line x1="189" y1="160" x2="201" y2="160" stroke="#C4B4AB" stroke-width="1.5"/>

    <circle cx="215" cy="160" r="14" fill="#D4C4BC" stroke="#C4B4AB" stroke-width="1"/>
    <text x="215" y="165" text-anchor="middle" font-size="9" font-weight="600" fill="#6B5040">5</text>

    <!-- Row 2: circles 6-9 with zigzag -->
    <line x1="215" y1="174" x2="215" y2="196" stroke="#C4B4AB" stroke-width="1.5"/>
    <circle cx="215" cy="210" r="14" fill="#D4C4BC" stroke="#C4B4AB" stroke-width="1"/>
    <text x="215" y="215" text-anchor="middle" font-size="9" font-weight="600" fill="#6B5040">6</text>
    <line x1="201" y1="210" x2="189" y2="210" stroke="#C4B4AB" stroke-width="1.5"/>

    <circle cx="175" cy="210" r="14" fill="#D4C4BC" stroke="#C4B4AB" stroke-width="1"/>
    <text x="175" y="215" text-anchor="middle" font-size="9" font-weight="600" fill="#6B5040">7</text>
    <line x1="161" y1="210" x2="149" y2="210" stroke="#C4B4AB" stroke-width="1.5"/>

    <circle cx="135" cy="210" r="14" fill="#D4C4BC" stroke="#C4B4AB" stroke-width="1"/>
    <text x="135" y="215" text-anchor="middle" font-size="9" font-weight="600" fill="#6B5040">8</text>
    <line x1="121" y1="210" x2="109" y2="210" stroke="#C4B4AB" stroke-width="1.5"/>

    <circle cx="95"  cy="210" r="14" fill="#D4C4BC" stroke="#C4B4AB" stroke-width="1"/>
    <text x="95"  y="215" text-anchor="middle" font-size="9" font-weight="600" fill="#6B5040">9</text>

    <text x="55" y="245" font-size="10" fill="#A08070">9 steps to first value</text>
  </g>

  <!-- Arrow -->
  <g>
    <line x1="270" y1="185" x2="310" y2="185" stroke="#C9440A" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="310,179 322,185 310,191" fill="#C9440A"/>
  </g>

  <!-- AFTER section -->
  <text x="345" y="130" font-size="10" font-weight="700" letter-spacing="1.5" fill="#C9440A">AFTER</text>

  <!-- 3 steps (clean, accented) -->
  <circle cx="365" cy="185" r="20" fill="url(#accent1)" filter="url(#shadow)"/>
  <text x="365" y="191" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
  <line x1="385" y1="185" x2="405" y2="185" stroke="#C9440A" stroke-width="2" stroke-dasharray="3,2"/>

  <circle cx="425" cy="185" r="20" fill="url(#accent1)" filter="url(#shadow)"/>
  <text x="425" y="191" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
  <line x1="445" y1="185" x2="465" y2="185" stroke="#C9440A" stroke-width="2" stroke-dasharray="3,2"/>

  <circle cx="485" cy="185" r="20" fill="url(#accent1)" filter="url(#shadow)"/>
  <text x="485" y="191" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">★</text>

  <text x="345" y="228" font-size="10" fill="#C9440A" font-weight="500">3 steps · immediate value</text>

  <!-- Divider -->
  <line x1="40" y1="275" x2="760" y2="275" stroke="#E0D0C8" stroke-width="1"/>

  <!-- Stats row -->
  <!-- Stat 1 -->
  <rect x="40" y="295" width="180" height="80" rx="10" fill="#fff" stroke="#EAD8D0" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="323" font-size="28" font-weight="800" fill="#C9440A" letter-spacing="-1">+34%</text>
  <text x="60" y="343" font-size="11" fill="#8B6B5A">Week-1 activation rate</text>
  <text x="60" y="360" font-size="10" fill="#B09080">↑ primary north star</text>

  <!-- Stat 2 -->
  <rect x="240" y="295" width="180" height="80" rx="10" fill="#fff" stroke="#EAD8D0" stroke-width="1" filter="url(#shadow)"/>
  <text x="260" y="323" font-size="28" font-weight="800" fill="#C9440A" letter-spacing="-1">−18s</text>
  <text x="260" y="343" font-size="11" fill="#8B6B5A">Time-to-first-action</text>
  <text x="260" y="360" font-size="10" fill="#B09080">from install to value</text>

  <!-- Stat 3 -->
  <rect x="440" y="295" width="180" height="80" rx="10" fill="#fff" stroke="#EAD8D0" stroke-width="1" filter="url(#shadow)"/>
  <text x="460" y="323" font-size="28" font-weight="800" fill="#C9440A" letter-spacing="-1">−27%</text>
  <text x="460" y="343" font-size="11" fill="#8B6B5A">Support tickets</text>
  <text x="460" y="360" font-size="10" fill="#B09080">onboarding-related</text>

  <!-- Stat 4 -->
  <rect x="640" y="295" width="120" height="80" rx="10" fill="#C9440A"/>
  <text x="700" y="323" text-anchor="middle" font-size="28" font-weight="800" fill="#fff" letter-spacing="-1">×2</text>
  <text x="700" y="343" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">product lines</text>
  <text x="700" y="360" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">adopted framework</text>

  <!-- Bottom tag -->
  <rect x="40" y="402" width="100" height="22" rx="11" fill="#F0E4DE" stroke="#E0CCC4" stroke-width="1"/>
  <text x="90" y="417" text-anchor="middle" font-size="10" font-weight="600" fill="#C9440A">2M+ users</text>

  <rect x="152" y="402" width="110" height="22" rx="11" fill="#F0E4DE" stroke="#E0CCC4" stroke-width="1"/>
  <text x="207" y="417" text-anchor="middle" font-size="10" font-weight="600" fill="#C9440A">Acme Corp · 2024</text>

  <rect x="274" y="402" width="100" height="22" rx="11" fill="#F0E4DE" stroke="#E0CCC4" stroke-width="1"/>
  <text x="324" y="417" text-anchor="middle" font-size="10" font-weight="600" fill="#C9440A">14 weeks</text>
</svg>
