<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F6F3"/>
      <stop offset="100%" stop-color="#EEF5F2"/>
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6e56"/>
      <stop offset="100%" stop-color="#0a4f3d"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a32d2d"/>
      <stop offset="100%" stop-color="#c44040"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#00000015"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg1)"/>

  <!-- Grid -->
  <g stroke="#D8E8E2" stroke-width="0.5" opacity="0.7">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/><line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/><line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Eyebrow label -->
  <text x="40" y="46" font-size="10" font-weight="700" letter-spacing="2.5" fill="#0f6e56">PRIVACY · FINTECH · B2B</text>
  <text x="40" y="70" font-size="20" font-weight="700" fill="#1a1916" letter-spacing="-0.5">Razor Vault — Privacy Gateway</text>

  <!-- ── LEFT: PII sources (messy, exposed) ── -->
  <text x="40" y="110" font-size="9" font-weight="700" letter-spacing="1.5" fill="#a32d2d">EXPOSED PII TODAY</text>

  <!-- Source nodes -->
  <rect x="40" y="120" width="130" height="36" rx="8" fill="#fff" stroke="#f7c1c1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="54" y="136" font-size="9" font-weight="600" fill="#a32d2d">🔍</text>
  <text x="68" y="136" font-size="10" font-weight="600" fill="#1a1916">Support Agent</text>
  <text x="68" y="149" font-size="9" fill="#a32d2d">Full PII visible</text>

  <rect x="40" y="166" width="130" height="36" rx="8" fill="#fff" stroke="#f7c1c1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="54" y="182" font-size="9" font-weight="600" fill="#a32d2d">📊</text>
  <text x="68" y="182" font-size="10" font-weight="600" fill="#1a1916">Data Analyst</text>
  <text x="68" y="195" font-size="9" fill="#a32d2d">Unmasked exports</text>

  <rect x="40" y="212" width="130" height="36" rx="8" fill="#fff" stroke="#f7c1c1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="54" y="228" font-size="9" font-weight="600" fill="#a32d2d">⚙️</text>
  <text x="68" y="228" font-size="10" font-weight="600" fill="#1a1916">Backend Eng.</text>
  <text x="68" y="241" font-size="9" fill="#a32d2d">Prod DB read access</text>

  <rect x="40" y="258" width="130" height="36" rx="8" fill="#fff" stroke="#f5c4b3" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="54" y="274" font-size="9" font-weight="600" fill="#993c1d">💼</text>
  <text x="68" y="274" font-size="10" font-weight="600" fill="#1a1916">Sales / BD</text>
  <text x="68" y="287" font-size="9" fill="#993c1d">PAN, GST, contacts</text>

  <!-- connecting lines (messy, all going to one point) -->
  <g stroke="#f7c1c1" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8">
    <line x1="170" y1="138" x2="220" y2="200"/>
    <line x1="170" y1="184" x2="220" y2="204"/>
    <line x1="170" y1="230" x2="220" y2="208"/>
    <line x1="170" y1="276" x2="220" y2="212"/>
  </g>

  <!-- ── CENTER: Razor Vault (the gateway) ── -->
  <!-- Glow halo -->
  <circle cx="305" cy="205" r="70" fill="#0f6e56" opacity="0.07"/>

  <!-- Vault outer ring -->
  <circle cx="305" cy="205" r="58" fill="none" stroke="#9fd4c4" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Vault body -->
  <rect x="262" y="162" width="86" height="86" rx="16" fill="url(#vaultGrad)" filter="url(#shadow)"/>

  <!-- Vault door detail -->
  <circle cx="305" cy="205" r="24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <circle cx="305" cy="205" r="14" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

  <!-- Lock icon -->
  <rect x="298" y="205" width="14" height="11" rx="2.5" fill="#fff"/>
  <path d="M299.5 205 v-4 a5.5 5.5 0 0 1 11 0 v4" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="305" cy="211" r="2" fill="#0f6e56"/>

  <!-- Vault label -->
  <text x="305" y="264" text-anchor="middle" font-size="11" font-weight="700" fill="#0f6e56" letter-spacing="1">RAZOR VAULT</text>
  <text x="305" y="277" text-anchor="middle" font-size="9" fill="#5a8a7e">Intent-Based Access Control</text>

  <!-- Policy engine badge -->
  <rect x="248" y="298" width="114" height="22" rx="11" fill="#e8f5f0" stroke="#9fd4c4" stroke-width="1"/>
  <text x="305" y="313" text-anchor="middle" font-size="9" font-weight="600" fill="#0f6e56">Policy Engine · FPE · Masking</text>

  <!-- ── RIGHT: Controlled access outputs ── -->
  <text x="430" y="110" font-size="9" font-weight="700" letter-spacing="1.5" fill="#0f6e56">INTENT-FILTERED OUTPUT</text>

  <!-- Output nodes — clean, green -->
  <rect x="430" y="120" width="145" height="36" rx="8" fill="#e8f5f0" stroke="#9fd4c4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="444" y="136" font-size="9" fill="#0f6e56">✓</text>
  <text x="458" y="136" font-size="10" font-weight="600" fill="#1a1916">Support Agent sees</text>
  <text x="458" y="149" font-size="9" fill="#0f6e56">Txn amount · last 4 digits</text>

  <rect x="430" y="166" width="145" height="36" rx="8" fill="#e8f5f0" stroke="#9fd4c4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="444" y="182" font-size="9" fill="#0f6e56">✓</text>
  <text x="458" y="182" font-size="10" font-weight="600" fill="#1a1916">Analyst sees</text>
  <text x="458" y="195" font-size="9" fill="#0f6e56">Anonymised cohort data</text>

  <rect x="430" y="212" width="145" height="36" rx="8" fill="#e8f5f0" stroke="#9fd4c4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="444" y="228" font-size="9" fill="#0f6e56">✓</text>
  <text x="458" y="228" font-size="10" font-weight="600" fill="#1a1916">Engineer sees</text>
  <text x="458" y="241" font-size="9" fill="#0f6e56">Error codes · no PII</text>

  <rect x="430" y="258" width="145" height="36" rx="8" fill="#e8f5f0" stroke="#9fd4c4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="444" y="274" font-size="9" fill="#0f6e56">✓</text>
  <text x="458" y="274" font-size="10" font-weight="600" fill="#1a1916">Sales sees</text>
  <text x="458" y="287" font-size="9" fill="#0f6e56">Business name · status only</text>

  <!-- connecting lines (clean, green) -->
  <g stroke="#9fd4c4" stroke-width="1.5" opacity="0.9">
    <line x1="363" y1="200" x2="430" y2="138"/>
    <line x1="363" y1="204" x2="430" y2="184"/>
    <line x1="363" y1="208" x2="430" y2="230"/>
    <line x1="363" y1="212" x2="430" y2="276"/>
  </g>

  <!-- ── BOTTOM: Stats ── -->
  <line x1="40" y1="342" x2="760" y2="342" stroke="#c8ddd8" stroke-width="1"/>

  <rect x="40" y="356" width="155" height="72" rx="10" fill="#fff" stroke="#e8e4dc" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="382" font-size="24" font-weight="800" fill="#0f6e56" letter-spacing="-1">₹400Cr</text>
  <text x="60" y="398" font-size="10" fill="#5c5852">Risk avoidance</text>
  <text x="60" y="413" font-size="9" fill="#9c9890">DPDP penalties avoided</text>

  <rect x="210" y="356" width="155" height="72" rx="10" fill="#fff" stroke="#e8e4dc" stroke-width="1" filter="url(#shadow)"/>
  <text x="230" y="382" font-size="24" font-weight="800" fill="#0f6e56" letter-spacing="-1">10:1+</text>
  <text x="230" y="398" font-size="10" fill="#5c5852">Build ROI</text>
  <text x="230" y="413" font-size="9" fill="#9c9890">₹30–50 Cr cost</text>

  <rect x="380" y="356" width="155" height="72" rx="10" fill="#fff" stroke="#e8e4dc" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="382" font-size="20" font-weight="800" fill="#185fa5" letter-spacing="-0.5">May 2027</text>
  <text x="400" y="398" font-size="10" fill="#5c5852">Hard deadline</text>
  <text x="400" y="413" font-size="9" fill="#9c9890">DPDP enforcement live</text>

  <rect x="550" y="356" width="210" height="72" rx="10" fill="url(#vaultGrad)" filter="url(#shadow)"/>
  <text x="655" y="379" text-anchor="middle" font-size="10" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="1">RAZORPAY</text>
  <text x="655" y="398" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">12M+ merchants</text>
  <text x="655" y="415" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">$180B TPV · 55% market share</text>
</svg>
